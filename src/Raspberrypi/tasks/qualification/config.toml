# =============================================================================
# Qualification round - open mat, three laps.
#
# Only the keys you want to change need to be here; anything missing falls back
# to DEFAULTS in tasks/path_task.py. Distances are millimeters, angles are
# degrees, speeds are MotorManager's 0-100 command.
#
# TUNING A WEAVE, in order. Change ONE thing, run, look.
#
#   1. max_road_wheel_deg is wrong.  Suspect this first - it scales EVERY
#      steering command, so if it is too low the robot turns more than the
#      controller asked for on every tick and hunts no matter what else you do.
#      Measure it, do not guess:   python test_steering.py --calibrate
#
#   2. Too fast for the steering lag.  Lag in time becomes lag in distance in
#      proportion to speed, and the robot goes unstable once that approaches
#      the lookahead. This is the dominant effect: at 200ms of lag the sim is
#      clean at speed 55 and diverges at 75. Drop speed.corner first.
#
#   3. corner_lookahead_fraction.  Raise it (toward 1.2) if it weaves IN the
#      corners; lower it (toward 0.6) if it cuts the apex and runs wide. It
#      trades corner accuracy against stability margin.
#
#   4. lookahead_base_mm.  Raise to damp a weave on the STRAIGHTS. Under heavy
#      lag longer is NOT automatically better - measured at 200ms lag, 260mm
#      beat 700mm - so sweep it rather than assuming.
#
#   5. lag_compensation_s.  Steers off where the robot will be, not where it
#      is. Worth a little; over-applied it destabilizes, so keep it at or below
#      the measured response time and never above 0.15.
#
# Every knob has a simulated trade-off table:
#     python test_steering.py --sweep speed.corner 40,50,60,70
# =============================================================================

[robot]
# The pose is the middle of the REAR (driving) AXLE. The lidar stands on the
# mast at the front, almost over the steering wheels, this far ahead of it -
# measured from the rear axle's centreline to the middle of the lidar. The
# localizer casts its rays from here and reports the axle.
lidar_ahead_mm = 120.0

[laps]
goal = 3

[speed]
# The two that matter. `base` is the straights; `corner` is the sharpest part
# of a corner, blended in as the path curves. Raise base first, and only raise
# corner once the robot stops running wide.
base = 255
corner = 200
# Used when the localizer is not confident. Deliberately slow: a bad pose
# means pure pursuit is chasing a point that may not be where it thinks.
lost = 40
minimum = 30

[path]
# How far the straights sit off the outer wall. Leave unset to centre the loop
# in the corridor, which leaves equal room either side and is the most
# forgiving line. Set it smaller to hug the outside, larger to hug the block.
#
# THIS IS WHERE THE REAR AXLE RUNS, not the lidar. The pose is the axle now
# (see [robot]); it used to be the lidar, and 130mm here was tuned with the
# lidar itself hugging the wall at 130mm. With the axle on the line the nose
# is what swings: every correction back onto the line points the nose at the
# wall first, and a nose 150mm further forward, 130mm off a wall, pointed
# 11deg into it puts that wall inside the safety backstop's +/-25deg cone at
# under front_stop_mm - so the robot stops, backs out, and does it again at
# the next corner exit. Measured over 6 simulated placements, 3 laps each
# (test_driving.py --round qualification --trials 6), pose on the axle:
#
#     130   0/6 finished   107s per lap   15 backstop stops in 1.8 laps
#     160   2/6             61s
#     180   6/6             54s
#     200   6/6             31s            worst wall gap +7.4cm
#     230   6/6             24s            worst wall gap +9.7cm   <- this
#     260   6/6             22s
#
# 230: comfortably past the cliff, and the straights still run 770mm from the
# centre block. Push it back toward 200 to hug the wall again, but not below
# 180.
wall_margin_mm = 230.0
#
# Corner radius. Leave unset for the biggest that still clears the centre
# block, and keep it above the robot's turning circle (setup warns if not).
#
# Pinned at 700 rather than left unset: that is exactly what the old default
# produced here, and RacingLine's default has since been corrected upward (it
# was subtracting a 170mm block margin that the geometry does not need - see
# CORNER_BLOCK_LIMIT). Unset now gives 870mm, which clears the block by the
# same 870mm and the wall by the same 130mm but shortens the lap by 292mm and
# opens the corners out. That is very likely an improvement, but it is a
# change to a round that is already tuned, so it is left as a deliberate
# choice: delete this line to take it.
corner_radius_mm = 700.0
resolution_mm = 20.0

[pursuit]
wheelbase_mm = 165.0

# Lookahead = base + per_speed * speed, clamped. This is THE tuning knob:
# raise it if the robot weaves down the straights, lower it if it runs wide in
# the corners.
lookahead_base_mm = 600.0
lookahead_per_speed_mm = 3.0
lookahead_min_mm = 400.0
lookahead_max_mm = 800.0

# Measure this one: put the wheel on full lock and a protractor on it. Getting
# it wrong scales every steering command, so the robot will consistently over-
# or under-steer no matter what else is tuned.
# Inside a bend the lookahead is additionally capped at this fraction of the
# bend's radius, which is what stops the robot cutting the apex and then
# running wide correcting. Lower it if it still cuts; raise it if it weaves.
# Measured on the sim: 0.9 -> 2.1cm corner error, 0.7 -> 1.2cm, off -> 4.2cm.
corner_lookahead_fraction = 0.75

# THE SERVO IS NOT A VALUE, IT IS AN ACTUATOR. Time constant of the steering,
# from `test_steering.py --lag`: ~0.35s to 63%. Everything that dead-reckons
# off the steering used to read the COMMAND, i.e. assume the wheels teleport -
# so during a correction, which is exactly when it matters, the odometry was
# handed yaw the robot had not done. The filter then believes a heading the
# robot is not on, pure pursuit corrects an error that is not there, the wheels
# swing back, and the robot wanders down the line without ever settling on it.
# That is a fault in the POSE, not in the geometry, which is why no lookahead
# value ever fixed it. 0 restores the old assumption.
#
# Measured in the sim at this round's 150mm lookahead against a 0.35s servo:
# the robot's own idea of its wheel angle goes from 3.7deg rms wrong to 1.5,
# and its heading from 0.35deg to 0.21. Check it on the mat with
# `python test_step_response.py --sweep pursuit.servo_lag_s 0,0.35`.
servo_lag_s = 0.35

max_road_wheel_deg = 30.0
max_steer_command = 35.0

# Distance from the pose reference back to the rear axle. The pose IS the
# rear axle (see [robot]), so this stays at 0.
rear_axle_offset_mm = 0.0

[steer]
# How fast the steering command may move, in command units per second. This is
# a RATE LIMIT, not a filter: it does nothing until the controller asks the
# servo to move faster than this, so ordinary cornering is untouched and only
# the sharp snaps are turned into sweeps. Those snaps are what shake the mast
# and blur the camera frame.
#
# Measured on the sim (2 laps, this config). "peak" is how fast the servo was
# actually driven; the tracking cost stays flat until the limit starts eating
# real corrections:
#
#     unlimited   peak 694 u/s   off-line rms 0.83cm
#     135         peak 135 u/s   off-line rms 0.81cm
#      90         peak  90 u/s   off-line rms 0.82cm
#      60         peak  60 u/s   off-line rms 0.82cm     <- 11x calmer, free
#      45         peak  45 u/s   off-line rms 1.65cm     <- starts to cost
#      30                        off-line rms 19.9cm, fails to finish
#
# So drop it to 60 if the camera is still shaking; below ~50 the robot starts
# losing the line. Leave unset for 3 x max_steer_command.
# max_rate_units_s = 60.0

[safety]
# Below this pose confidence the round drives at speed.lost; stay there longer
# than lost_timeout_s and it stops rather than guessing.
min_pose_confidence = 0.35
lost_timeout_s = 4.0

# Lidar backstop, independent of the path. Slows from front_slow_mm and stops
# at front_stop_mm, measured in a +/-front_sector_deg cone off the nose.
front_slow_mm = 450.0
front_stop_mm = 220.0
front_sector_deg = 25.0

[startup]
# How long to sit still waiting for the particle filter to converge before
# driving off. It normally takes well under a second.
localize_timeout_s = 8.0

# Drive speed 100 in mm/s. Only feeds the filter's motion model, so a rough
# figure is fine - the lidar does the real work. Measure it by timing a
# straight run if the robot fights its own odometry.
# 700 through the original gearing; 390 MEASURED with a tape after the 16:28
# reduction was fitted - 700mm in 3.0s at command 60.
mm_per_s_at_full = 390.0
