# =============================================================================
# Final round - three laps with red/green pillars, then park.
#
# The driving is planned, not profiled: each pillar becomes a GOAL POSE beside
# it on the correct side, and GoalPlanner joins those goals with a path the
# steering can actually hold, sweeps the robot's body along it, and reports
# what clearance the pass really gets. See classes/goal_planner.py.
#
# The single most important consequence for tuning: blocks.clearance_mm is now
# a REQUEST. If the corridor cannot give it, the plan takes what fits, says
# COMPROMISED in the status line with the pillar and the millimetres, and
# drops to speed.compromised. It no longer clamps in silence. So if a pass
# looks tight on the mat, read the status line - it will already have told you
# which pillar and by how much.
#
# Anything missing here falls back to DEFAULTS in tasks/path_task.py.
# Distances are millimetres, angles degrees.
# =============================================================================

[laps]
goal = 2

[speed]
# A speed is the RAW PWM duty the Arduino writes (0-255), not a percentage -
# the value goes to analogWrite unchanged. These are the figures measured
# AFTER the 16:28 reduction was fitted (see startup.mm_per_s_at_full): 60 is
# about 24% duty and around 234mm/s.
base = 65
corner = 60
lost = 55
minimum = 55
# While the planner reports a pass it could not give full clearance to. Every
# margin that makes a tight pass survivable - the lidar backstop having time
# to fire, tracking error staying small, the pose staying fresh - is bought
# with speed, so this is the one knob that helps in every compromised case.
# Held at speed.minimum, as it was before the reduction.
compromised = 55

[path]
resolution_mm = 20.0

# Gap from the outer wall to the straights. Unset centres the loop in the
# corridor (500mm to the wall, 500mm to the centre block), which is the most
# forgiving line and leaves a pass equal room either way.
wall_margin_mm = 520.0

# Corner radius. Unset takes the biggest that still clears the centre block,
# which here is 480mm - this is deliberately WIDER than that.
#
# It is the one knob that moves the last failure mode. A pass that has to go
# round the INSIDE of a bend is the case the corner geometry limits: holding
# the plan `d` mm inside an arc of radius R makes it an arc of radius R - d,
# so an inward pass spends the corner's radius one for one and stops being
# drivable once R - d falls below the turning circle. The budget is therefore
# corner_radius - turning_circle, and a pillar already sitting inward of the
# line needs that plus however far inward it sits. A wider corner is more
# budget, directly.
#
# Measured over 24 simulated 3-lap runs (test_driving.py --round final),
# counting only pillars the robot had a fair chance at - the simulator places
# them by lap position and can drop one 270mm in front of the start, which
# nothing can dodge:
#
#     480   91% of passes correct and clear,  0-1 runs in 12 touched a wall
#     620   97% / 87%,                        0-1 runs in 12
#     680   87%,                              5-8 runs in 12  <- corner now
#     760   87%,                              5   runs in 12     cuts too close
#
# So 620. Past about 650 the corner itself starts running out of room against
# the wall and the block, and what the pass gains the lap loses.
corner_radius_mm = 620.0

[pursuit]
wheelbase_mm = 165.0

# The plan already respects the turning circle, so the lookahead no longer has
# to be short enough to keep pure pursuit from cutting across a steep dodge -
# there are no steep dodges to cut across. Kept moderate rather than raised
# straight away: raise it if the robot weaves on the straights, lower it if it
# runs wide, and re-measure after any change to max_road_wheel_deg.
lookahead_base_mm = 110.0
lookahead_per_speed_mm = 2.5
lookahead_min_mm = 110.0
lookahead_max_mm = 400.0

# Inside a bend the lookahead is additionally capped at this fraction of the
# bend's radius, which is what stops the robot cutting the apex and then
# running wide correcting. Lower it if it still cuts; raise it if it weaves.
corner_lookahead_fraction = 0.60

# Full lock at the road wheel. 50.0 is the parking branch's figure, kept
# because servo_lag_s and the lag model below were tuned against it.
#
# NOTE: the two branches disagreed here and BOTH left a stale comment. main
# carried 44.0 while citing a SteeringCalibrator reading of 48.5; this branch
# carried 50.0 while arguing from measured arcs (road-wheel angles of
# 20.5/31.8/39.4deg at commands 20/35/50, implying a full lock of
# 47.2/41.8/36.2 and falling as the command rises) that 39 was the honest
# figure. Re-measure before the next run:
#     python test_step_response.py
max_road_wheel_deg = 50.0
max_steer_command = 46.0
rear_axle_offset_mm = 0.0

# Measured with test_steering.py --lag: true response is ~0.35s to 63%, more
# than double what is safe to compensate for (over-predicting overshoots worse
# than not predicting at all). The gap between 0.35s real and the compensated
# figure is why speed.corner is cut, rather than raising this further.
lag_compensation_s = 0.1

# THE SERVO IS NOT A VALUE, IT IS AN ACTUATOR. Time constant of the steering,
# from `test_steering.py --lag`: ~0.35s to 63%. Everything that dead-reckons
# off the steering used to read the COMMAND, i.e. assume the wheels teleport -
# so during a correction, which is exactly when it matters, the odometry was
# handed yaw the robot had not done. The filter then believes a heading the
# robot is not on, pure pursuit corrects an error that is not there, the wheels
# swing back, and the robot wanders down the line without ever settling on it.
# That is a fault in the POSE, not in the geometry, which is why no lookahead
# value ever fixed it. 0 restores the old assumption.
#
# Measured in the sim at this round's 150mm lookahead against a 0.35s servo:
# the robot's own idea of its wheel angle goes from 3.7deg rms wrong to 1.5,
# and its heading from 0.35deg to 0.21. Check it on the mat with
# `python test_step_response.py --sweep pursuit.servo_lag_s 0,0.35`.
servo_lag_s = 0.35


[startup]
localize_timeout_s = 8.0

# WHICH WAY THE ROBOT IS PLACED, in field degrees: 0 = +Y, 90 = +X, 180 = -Y,
# 270 = -X. THIS IS NOT OPTIONAL WHEN THERE IS A COMPASS.
#
# The field is 90-degree rotationally symmetric, so the lidar cannot tell the
# four quadrants apart - only the IMU can, and the IMU's zero is wherever it
# happened to boot. Leaving this unset does not mean "no compass": it means a
# compass the filter believes and nobody has anchored, which is the worst of
# the three states. The pose then comes out rotated by a multiple of 90deg -
# consistently, every run - and everything read off it rotates with it: the
# lap direction, the start section, where the bay is, and the projection onto
# the racing line that counts the lap. A quarter-lap error in that counter is
# the round ending in the wrong sector, and parking starting nowhere near the
# bay.
#
# To find the right value: set one of the four, run, and read the startup line
# "Parking bay expected in the <section> section". If that is not the section
# the bay is really in, rotate this by 90 and go again.
start_heading_deg = 180.0

# 700 through the original gearing; 390 MEASURED with a tape after the 16:28
# reduction was fitted - 700mm in 3.0s at command 60. Re-measure the same way
# if the drivetrain changes: `python test_steering.py --tape 3 --drive-speed 60`.
# NOT with --calibrate: that derives distance from the pose track, and this
# number is what feeds the filter's motion model - measuring it through the
# pose is circular, and a wrong value here is what makes the pose jitter.
mm_per_s_at_full = 390.0

[blocks]
# ---------------------------------------------------------------------------
# The corridor is 1000mm wide: 500mm from the racing line to the outer wall
# and 500mm to the centre block. A pass has to fit the block's half-diagonal
# (35mm), the robot's half width, and clearance_mm into that, measured from
# wherever the pillar actually sits - so the room a pillar off the centreline
# leaves on its own side is 500mm MINUS how far off it is.
#
# The old value here was 430mm, which needed 535mm of offset out of a corridor
# that could give 390mm. Every pass was clamped, on every pillar, and nothing
# said so; a pillar 300mm toward the side it had to be passed on came out at
# 25mm of body clearance while the code reported a healthy dodge. Setup now
# prints the arithmetic and refuses to be quiet about it.
# ---------------------------------------------------------------------------

# Gap between the robot's BODY and the pillar's near face as it goes past.
# A request, not a promise - see the header.
clearance_mm = 400.0

# Half the robot's own width (centreline to its widest point - wheels,
# mudguards, whatever sticks out furthest). A MEASUREMENT, not a tuning knob.
robot_half_width_mm = 80.0

# How far ahead a pillar may be MAPPED, overriding block_map's own 1500mm.
# Less critical than it was: a goal is a pose, not a schedule, so a pillar
# confirmed late gets a shorter, firmer approach rather than a step in the
# steering. What range still buys is warning; what it costs is a red smudge on
# the wall getting a vote on the plan.
map_range_mm = 1800.0

# How long a pillar keeps its goals after its track is lost. A pass must not
# be cancelled by a dropped frame - that is a collision - so it is held, and
# this bounds how long a wrong detection can hold it.
memory_s = 1.5

# Real gap from the robot's BODY to the outer wall or the centre block. The
# walls' positions are exactly known field geometry, with none of a pillar's
# detection uncertainty, so this can run tighter than clearance_mm - but not
# to 0; pose tracking still has noise, and a plan is checked against half this
# before it is called clear.
wall_clearance_mm = 130.0

# How much of the robot's turning circle to keep in hand. The plan is drawn
# with arcs no tighter than turning_circle x this, because a path at exactly
# full lock is one the follower can only just hold, with nothing left to
# correct tracking error with. 1.0 is the bare geometric limit.
turn_radius_margin = 1.15

[goals]
# ---------------------------------------------------------------------------
# The shape of a plan. Each pillar contributes two goals - a PASS beside it
# and an EXIT past it, both squared up with the track:
#
#            approach_mm                    exit_mm
#          |<--------->|                  |<------->|
#      ____                 [PASS]===[EXIT]
#          \____________ ,-'                        `-.____
#                     route goals stop here          plan returns to the line
#
# The exit goal is what keeps the robot out until its TAIL is clear. Without
# one the plan may start folding back the instant the centre of the robot
# draws level with the pillar, which is when the rear overhang is still
# swinging past it.
# ---------------------------------------------------------------------------

# Below this achieved body clearance a pass is reported COMPROMISED and the
# speed drops. Not the clearance being aimed for - that is blocks.clearance_mm
# - but the point below which a pass stops being one.
min_clearance_mm = 45.0

# How much lap one plan covers. Must comfortably exceed the lookahead or the
# robot drives off the end of its own plan between replans; setup warns if it
# is under 3x. Reaching much further is wasted work - it is replanned before
# the far end is reached.
horizon_mm = 3000.0

# Goal spacing along an empty stretch. These exist to hold the plan near the
# racing line: a single Dubins segment spanning a whole side of the field is
# the shortest path between its two ends and nothing in it prefers the line,
# so it would bow out toward the wall on the way. Spacing is therefore how
# closely the plan tracks the line where there are no pillars - measured with
# none at all, 550mm gave 6.3cm rms off the line, 350mm gives 5.5cm, and
# 250mm gives 5.6cm, so there is nothing below about 350 and it costs a
# Dubins segment per goal.
route_spacing_mm = 400.0

# How far short of a pillar the route goals stop, so nothing pulls the robot
# back onto the centreline on the run-in to a pass.
approach_mm = 200.0
# How far past a pillar the plan holds its offset before returning to the
# line. Raise it if the robot clips pillars with its back end on the way out.
exit_mm = 330.0

# How far BEFORE the pass to name a pose carrying the PASS's heading, so the
# run-in is a straight line and the robot arrives already pointing the way it
# will leave.
#
# The problem it fixes only exists on a corner. The pass and the exit each take
# the track's heading at their own progress, and mid-bend those differ by about
# 32 degrees - so the plan is still turning as it draws level with the pillar,
# and the body leans into the thing it is dodging.
#
# Measured over 24 simulated runs, 96 pillar encounters, one lap, four pillars:
#
#     align   passes correct   touched   mean gap   worst wall   crashes
#       0        88/96           13       73.9mm       15mm         0
#     150        88/96           13       85.9mm       25mm         0
#     200        88/96           13       87.6mm       25mm         0    <- this
#     250        88/96           13       87.6mm       24mm         0
#     300        88/96           14       85.8mm      -58mm         3
#
# So it buys MARGIN rather than passes: the same pillars are passed on the same
# sides, with 14mm more room, and no more wall contact. Past 250 it falls off a
# cliff - the align pose ends up far enough back that reaching it costs more
# than arriving square is worth.
#
# Holding the EXIT on the pass's heading too, making a straight band right
# past the pillar, was tried and is not here: it took worst wall clearance to
# -24mm and crashed a run.
align_mm = 200.0

# How many pillars one plan reaches through. Beyond three the far ones are
# replanned before they are reached anyway.
max_gates = 3

# The robot's extent forward of and behind THE POINT THE POSE DESCRIBES, which
# with pursuit.rear_axle_offset_mm at 0 is the rear axle - so robot_front_mm is
# nearly the whole length of the car, not half of it. The front overhang is
# what swings widest through a corner and what reaches a pillar first, so
# understating it plans passes that clear on paper and clip on the mat.
#
# MEASURE BOTH, with a ruler, from the rear axle:
robot_front_mm = 200.0
robot_rear_mm = 40.0

# How often a plan is rebuilt when nothing it was built from has changed.
# Planning costs well under a millisecond, but a plan rebuilt every tick from
# a slightly different pose has a target point that jitters. A pillar
# appearing or the robot drifting off the plan forces one immediately,
# whatever this says.
replan_interval_s = 0.1
replan_cross_track_mm = 120.0

[steer]
# How fast the steering command may move, in command units per second. A RATE
# LIMIT, not a filter: it does nothing until the controller asks the servo to
# move faster than this, so ordinary cornering is untouched and only the sharp
# snaps - the ones that shake the mast and blur the camera frame - are turned
# into sweeps. Leave unset for 3 x max_steer_command.
# max_rate_units_s = 60.0

[safety]
min_pose_confidence = 0.35
lost_timeout_s = 4.0
# The lidar backstop, independent of the plan. A correctly executed pass now
# targets clearance_mm (150mm) of real body gap, so these sit comfortably
# below it: a good pass never trips them, but a pass that is actually going
# wrong is still caught before contact.
front_slow_mm = 220.0
front_stop_mm = 130.0
front_sector_deg = 25.0

# =============================================================================
# [parking] - a script the lidar starts, not a trajectory the map plans.
#
# Drive alongside the outer wall on a side lidar range, held at a distance AND
# held parallel, right up to the bay; when that range steps
# in, that is the bay wall (it stands 200mm proud of the outer wall, and
# nothing else on the field does); roll on a measured distance, then two
# reverse legs at two fixed steering angles. Nothing here reads the pose.
#
#   setup -> u-turn -> follow -> [wall steps closer, camera says pink] ->
#   creep -> turn in 90deg -> nose in -> back off -> rotate flat -> stopped
#
# IN PERPENDICULAR, THEN ROTATE FLAT - not a parallel park. At 39deg of lock a
# 210mm body cannot be threaded lengthwise into a 340mm slot on an arc; swept
# over a realistic spread of entry conditions the best of 630,000 combinations
# still left a corner 31mm outside. Nose-first uses the slot's 340mm against
# the body's 150mm WIDTH, and the rotation flat happens inside the bay.
#
# NOTHING IS TIMED. Two steps end on the compass, three on the lidar, one on
# the camera and the lidar together.
#
# THE FIVE NUMBERS BELOW ARE THE PARK and all start unset. Measure them on the
# mat; the sequence refuses to drive until they are all in, and says which are
# missing. Tune them in order - each one only makes sense once the one before
# it is right.
# =============================================================================
[parking]
enabled = true

# 1. how far off the outer wall to run while looking for the bay, and how
#    hard to hold it there. Far enough out that the bay wall is a clear step
#    in the range, close enough that the park starts from beside the bay.
follow_mm = 800.0
# WIDE, for two separate reasons. The bay walls stand 200mm proud of the outer
# wall and the body is 150mm across, so anything under 275mm drives the flank
# straight through them - 230 was 45mm into them. And a 90deg turn at full lock
# drops the rear axle 204mm toward the wall: from 300mm out the nose would
# finish 74mm THROUGH it, where 450mm leaves it 76mm short for nose-in to close.
# 450, NOT 300: this is the number every other one in this section was tuned
# against - front_stop_mm, trigger_below_mm and the nose-in geometry all say
# "the follow runs 450mm off the wall". At 300 the turn ends with the nose
# 74mm THROUGH the outer wall, so the clearance guard aborts partway in and
# the round drives on without parking; and 300 is BELOW trigger_below_mm, so
# plain wall reads as a bay wall. 450 is also very nearly the middle of the
# 1000mm road, which is where the reverse and the turn-in want to start from.
wall_distance_mm = 450.0
wall_gain = 0.3
wall_max_steer = 30.0

# 2. which lidar sector watches the wall. The sign is applied for you - it
#    looks at whichever side the wall is on. Narrow it if the mast or the
#    camera clips the beam.
side_bearing_deg = 90.0
side_sector_deg = 30.0

# 2b. holding the HEADING as well as the distance, all the way to the bay. A
#     line is fitted through the whole visible arc of wall either side of the
#     perpendicular, and its slope is the yaw relative to the wall.
#     angle_gain is steering command per degree of yaw - set it to 0 and the
#     follow only sees a distance, which is what let the robot freeze the
#     heading it arrived on and walk forward. Raise it if it drifts off the
#     wall, lower it if it weaves. angle_arc_deg is the arc's half-width:
#     wider averages more returns and is quieter, but reaches further ahead
#     where the bay wall turns up early. A reading past angle_max_deg is a
#     corner or a step, not the wall, and is discarded.
angle_gain = 0.6
angle_arc_deg = 25.0
angle_min_points = 12
angle_max_deg = 30.0

# Pure pursuit is off from the moment parking starts, so the sequence watches
# ahead itself: closer than front_stop_mm means a corner, and the run-out turns
# early rather than driving into it (the run-in gives up and retries instead).
# 450, not 600: the follow now runs 450mm off the wall, and a beam 5deg off
# the nose meets that wall 587mm ahead once the robot is 45deg crooked - close
# enough to 600 to read as a corner that is not there. At 450 it would take
# 60deg of yaw, which angle_max_deg does not let the follow reach.
front_stop_mm = 450.0
front_sector_deg = 10.0
front_hold_s = 0.4
# 3. the range that means "bay wall". Leave unset for wall_distance_mm - 120.
#    At 450mm out a bay wall standing 200mm proud reads about 250, so the
#    threshold has to sit between the two - not down at 140, which was set for
#    a 230mm follow and would never trip from out here.
trigger_below_mm = 330.0

# 4. THE PARK - head in, square to the wall.
#
#    CREEP. The trigger fires off the WIDE sector, which reports its closest
#    return and so catches a bay wall well before the robot is level with it.
#    The NARROW beam (mouth_sector_deg) is what says "level", and that is the
#    reference the whole turn is measured from.
mouth_sector_deg = 6.0
# blade_below_mm = 330.0     # unset = the same threshold as the trigger
creep_max_mm = 700.0

#    THE LIDAR IS NOT AT THE AXLE - it is 130mm forward of it. That moves both
#    ends of this: the beam goes level with a bay wall while the axle is still
#    130mm short of it, and it reads the outer wall from 130mm closer than the
#    nose is. Measure this one properly, it moves everything below.
lidar_ahead_mm = 130.0

#    MEASURE THE BAY, then back up to its middle. Instead of turning a fixed
#    distance after the first bay wall, drive past BOTH walls - so the bay's
#    real width, and so its real middle, is measured rather than assumed - and
#    then reverse to the point the turn has to start from. Costs a bay-length
#    of travel and the reverse that undoes it. Falls back to turn_after_mm if
#    the second wall is never seen.
#
#    A bay wall is 10mm thick and the beam's footprint is wider than that, so
#    right at the crossing the beam flickers clear-then-blocked within 20mm -
#    which reads as a 20mm-wide bay. So the mouth only counts once the beam
#    has been clear for mouth_clear_mm, and the far wall only counts beyond
#    bay_min_mm from the near one.
measure_bay = true
mouth_clear_mm = 60.0
bay_min_mm = 170.0

#    SQUARE UP BEFORE BACKING IN. Everything from the reverse onward is open
#    loop - a measured reverse, a turn on the compass, a straight run in - so
#    the pose the robot is in when it starts backing up is the pose the whole
#    manoeuvre is measured from. Alongside the bay is the worst place to take
#    it: the side lidar has been looking at a bay wall rather than at the
#    wall, so the follow has been flying blind for a bay's length. Past the
#    far wall the beam is clean again, so it is given a little road to settle
#    on, and what it spends there is added to the reverse so it costs position
#    nothing. settle_max_mm caps it; the tolerances say "close enough".
#    While it is driving PAST the bay the side lidar reads a bay wall, not the
#    wall - an ordinary follow there would see 250mm, decide it was too close
#    and steer AWAY from the thing it is parking in. So it keeps its place in
#    the road off the CENTRE BLOCK instead: the road's width is measured on
#    the way in, so the distance to the block that matches the right distance
#    from the wall is known. inner_slack_mm is how far off that it may read
#    before being disbelieved - near a corner the block is not there, and a
#    beam that sees across the field would pull the robot into the wall.
inner_sector_deg = 30.0
inner_slack_mm = 250.0

settle_max_mm = 600.0
settle_tolerance_mm = 40.0
settle_angle_deg = 3.0
# How far the settle gate widens over settle_max_mm: 2.0 means the
# tolerances above end up three times as loose by the time the road runs
# out, so a nearly-square robot stops straight away instead of walking
# the whole allowance. 0 restores the old all-or-nothing behaviour.
settle_relax = 0.5

#    turn_after_mm is the fallback, used only when measure_bay is off or the
#    second wall is never found. It rolls on further before turning in. UNSET
#    lands the body in the middle of the bay on its own: half the bay, plus
#    how far the lidar leads the axle, minus the radius the turn carries the
#    axle through - 170 + 130 - 204, about 96mm. At zero it lands 96mm off
#    centre, far enough over to graze the far wall.
# turn_after_mm = 0.0

#    TURN IN, counted on the COMPASS. Leave the steer unset for full lock,
#    which is the tightest arc and what the 204mm drop above assumes.
turn_in_deg = 90.0
# turn_in_steer = 45.0

#    THE TURN NEEDS ROOM. It carries the axle a whole radius (204mm) toward
#    the wall before the nose comes round, so it has to start at least
#    radius + nose away from it. Unset = 204 + 170 + 30 = about 404mm. From
#    360mm the body clips a bay wall by 40mm; from 320mm the nose ends up 54mm
#    INSIDE the outer wall. Closer than this the attempt is abandoned rather
#    than driven into the bay - which is why wall_distance_mm is 450.
# turn_in_min_mm = 404.0

#    HOLDING THE HEADING ON THE STRAIGHT LEGS. Steering zero is not the same
#    as going straight: the creep and the drive into the bay both run on from
#    a servo that has just been at full lock, and two degrees held for half a
#    metre is the difference between arriving square in the bay and across it.
#    The side lidar cannot help by then - it is looking at a bay wall, not the
#    wall - so the reference is the wall's own heading, which the follow
#    learns on the compass while it still can. Steering command per degree;
#    0 turns the correction off.
heading_gain = 1.5

#    How far the NOSE stops off the outer wall - not what the beam reads; the
#    code subtracts the mount offset for you. This is the one place an error
#    in everything upstream is absorbed rather than added to, so tune it last
#    and tune it here. The body is 210mm and the bay 200mm deep, so at a 20mm
#    nose gap about 30mm of tail still sits proud of the bay mouth.
nose_stop_mm = 20.0

#    THE CAMERA. The lidar sees a step 200mm proud of the wall and cannot tell
#    a bay wall from a pillar standing next to one; the camera sees that it is
#    pink but, through an object of unknown size, not how far away. So the
#    lidar picks the moment and the camera only has to agree the thing is pink
#    and roughly on the expected side. Set false to run on the lidar alone.
camera_confirms = true
camera_bearing_deg = 60.0

# 5. speeds, and the pause that lets the servo reach each new angle before the
#    wheels move. Slow: every millimetre of overshoot lands on the tightest
#    clearance of the whole manoeuvre, and the legs are measured by odometry.
speed = 50
reverse_speed = 60
servo_settle_s = 0.4
timeout_s = 20.0

# Parking starts THIS far before the last lap would have finished, so the
# follow gets a run at the wall before the bay turns up in it - it needs about
# 1.4m to settle onto the wall from a bad handover. Then: how many failed
# attempts to retry before giving up and driving out the clock.
start_early_mm = 800.0
# 2, not 0: at 0 the FIRST abort gives up on the bay for the whole round and
# just drives out the clock, which is a round that settles into the approach,
# quits, and laps without ever trying again. Each retry costs most of a lap.
# PARK, NO MATTER WHAT. The laps ending is the end of the driving part of the
# round - after it the manoeuvre owns the wheels and keeps trying until it
# closes. No extra laps hunting for the bay, no going round for another run,
# no giving up and driving out the clock. A failed attempt reverses this far
# and goes again, as many times as the clock allows.
retry_back_mm = 900.0

[unpark]
# Leaving a bay the robot was PLACED in, before the first lap. Off unless the
# run is actually starting in one - switched on for a start on the track it
# just swerves. See UnparkController in classes/parking.py.
#
# Which way out is not set here: the robot stands still for look_s, compares
# the lidar's left and right sectors, and leaves toward whichever has room in
# it. default_side (+1 right, -1 left) only decides ties.
enabled = true
# The sequence is: look, turn the servo, reverse, turn the servo the other
# way, drive out.
#
# THE THREE NUMBERS THAT MATTER, all measured on the mat. reverse_mm is how
# far it backs up first, to buy the room the turn needs (0 = no reverse);
# steer_command is a MAGNITUDE (the sign comes from the open side);
# forward_mm is how far to drive on that lock before the racing line takes
# over.
reverse_mm = 160.0
steer_command = 45.0
forward_mm = 340.0
# Counter-steer for the reverse leg, a MAGNITUDE pointing AWAY from the exit
# side. Reversing negates yaw rate, so backing up on the opposite lock turns
# the robot the same way the forward leg will - it leaves the bay mouth with
# the nose already aimed out, instead of having to develop all that yaw from
# inside the slot. The tail swings the other way while it does, so 0 (straight
# back) is the right answer for a bay with no room behind the rear corners.
reverse_steer_command = 20
speed = 65
reverse_speed = 60
look_s = 0.6
servo_settle_s = 0.4
side_bearing_deg = 90.0
side_sector_deg = 45.0
side_margin_mm = 100.0
default_side = 1
timeout_s = 15.0
