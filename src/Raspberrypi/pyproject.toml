[project]
name = "futuree"
version = "0.1.0"
description = "WRO Future Engineers robot control code"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=2.0",
    "pyserial>=3.5",
    "rplidarc1>=0.1.3",
    "smbus2>=0.6.1",
    "rpi-gpio>=0.7.1",
    "adafruit-circuitpython-bno055>=5.4.22",
    "adafruit-blinka>=9.2.0",
]

[tool.uv]
package = false
