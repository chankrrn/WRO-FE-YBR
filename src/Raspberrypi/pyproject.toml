[project]
name = "futuree"
version = "0.1.0"
description = "WRO Future Engineers robot control code"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=2.0",
    "pyserial>=3.5",
    "rplidarc1>=0.1.3",
    "smbus2>=0.6.1",
    # Linux only: RPi.GPIO is a C extension against the Pi's own headers
    # and cannot build on a Windows or macOS dev machine. The marker is
    # true on the Pi, so nothing changes there; off the Pi it lets
    # `uv sync` finish and the simulators (test_driving, test_plan_view,
    # test_goal_planner) run, none of which touch GPIO.
    "rpi-gpio>=0.7.1 ; sys_platform == 'linux'",
    "adafruit-circuitpython-bno055>=5.4.22",
    "adafruit-blinka>=9.2.0",
]

[tool.uv]
package = false
